  <script id="preserve-contact-invite">
  (function(){
    var key="ilbp-pending-contact";
    var params=new URLSearchParams(location.search);
    var contact=(params.get("contato")||"").trim().replace(/^@/,"");
    if(contact){
      localStorage.setItem(key,contact);
      return;
    }
    var pending=localStorage.getItem(key);
    if(pending){
      params.set("contato",pending);
      history.replaceState(null,"",location.pathname+"?"+params.toString()+location.hash);
    }
  })();
  </script>

  <script id="ilbp-password-eye-v11">
  (() => {
    const installEyes = () => {
      document.querySelectorAll('input[type="password"]').forEach(input => {
        const field = input.closest('.field') || input.parentElement;
        if (!field || field.querySelector('.ilbp-password-eye')) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ilbp-password-eye';
        btn.setAttribute('aria-label', 'Mostrar senha');
        btn.setAttribute('title', 'Mostrar senha');
        btn.textContent = '👁';
        btn.addEventListener('mousedown', e => e.preventDefault());
        btn.addEventListener('click', e => {
          e.preventDefault(); e.stopPropagation();
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.textContent = show ? '🙈' : '👁';
          btn.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
          btn.setAttribute('title', show ? 'Ocultar senha' : 'Mostrar senha');
          input.focus();
        });
        field.style.position = 'relative';
        input.style.paddingRight = '48px';
        field.appendChild(btn);
      });
    };
    new MutationObserver(installEyes).observe(document.documentElement,{childList:true,subtree:true});
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',installEyes); else installEyes();
  })();
  </script>

<script id="il-mobile-viewport-script-20261011">

 }

 if(viewport){viewport.addEventListener("resize",schedule);viewport.addEventListener("scroll",schedule)}
